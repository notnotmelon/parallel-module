[mod-setting-description]
parallel-module-allow-in-furnaces=Allows use of [item=parallel-module-3] inside [entity=electric-furnace], [entity=crusher] and all other modded "furnace" entities. This works by swapping every instance of this entity to an identical assembling machine prototype. [img=utility/warning_icon] May cause compatibility issues.
parallel-module-rounding-strictness=Reduces the total number of parallel recipes by a factor. Rounds module effects to the nearest available parallel recipe. Useful if you are near the 65535 recipe limit.
parallel-module-max-ingredient-product-amount=Sets the maximum total amount of any single ingredient or product allowed when recipes are run in parallel. This caps the effective parallel multiplier on a machine.\n[font=default-bold][color=255,230,192]Min:[/color][/font] 100\n[font=default-bold][color=255,230,192]Max:[/color][/font] 65535
parallel-module-exclude-fluid-recipes=If a recipe has fluids inputs or fluid outputs, it will be excluded from parallel modules. This setting is useful if you approach the game's hardcoded 65535 recipe limit.

[string-mod-setting]
parallel-module-rounding-strictness-12x=Start rounding after 12x
parallel-module-rounding-strictness-24x=Start rounding after 24x
parallel-module-rounding-strictness-48x=Start rounding after 48x
parallel-module-rounding-strictness-never-round=Never round

[warnings]
too-many-recipe-prototypes=[img=utility/warning_icon] [font=default-bold][color=pink][PARALLEL MODULE][/color][/font] You are dangerously close to the maximum number of recipes allowed in the game engine. __1__ used out of __2__ maximum. Consider reducing the number of parallel recipes through the startup mod settings.